name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gcc:
    name: GCC ${{ matrix.gcc }} (${{ matrix.build.name }})
    runs-on: ubuntu-latest
    container: gcc:${{ matrix.gcc }}
    strategy:
      fail-fast: false
      matrix:
        gcc: ["16"]
        build:
          - name: default
            options: ""
          - name: sanitizers
            options: >-
              -DCMAKE_BUILD_TYPE=Debug
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"

    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build python3

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=g++ ${{ matrix.build.options }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Single header is up to date
        run: python3 tools/amalgamate.py --check
